name: build-wimlib-portable

# Independent wimlib pipeline (decoupled from build-qemu-portable).
# Own tags (wimlib-vX.Y.Z), own ccache keys, own artifacts. A wimlib change
# never triggers a QEMU rebuild and vice versa: push paths are scoped to
# wimlib files only.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wimlib.yml"
      - "scripts/*wimlib*"
      - "scripts/select-platforms.py"
  pull_request:
    paths:
      - ".github/workflows/build-wimlib.yml"
      - "scripts/*wimlib*"
      - "scripts/select-platforms.py"
  workflow_dispatch:
    inputs:
      wimlib_version:
        description: "wimlib version (e.g. X.Y.Z) or 'auto' for latest stable"
        required: false
        default: "auto"
        type: string
      platforms:
        description: "'all' or comma-separated subset: win-x64,linux-x64,linux-arm64,macos-arm64"
        required: false
        default: "all"
        type: string
      force:
        description: "Publish a release even if this wimlib version already has one"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 6 * * 1" # weekly Monday, offset from QEMU job
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PREFIX: /wimlib-portable

jobs:
  resolve:
    name: Resolve wimlib version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tarball: ${{ steps.v.outputs.tarball }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: bash scripts/resolve-wimlib.sh "${{ inputs.wimlib_version || 'auto' }}"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WIMLIB_VERSION: ${{ steps.v.outputs.version }}
        # One release per upstream version: skip publishing if this version
        # already has a release (build still runs for validation/artifacts).
        # This is the "downloads already exist, no rebuild" gate.
        run: |
          if gh release view "wimlib-v${WIMLIB_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wimlib-tarball
          path: wimlib-*.tar.gz*

  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    needs: [resolve]
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      publish: ${{ steps.m.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          PIPELINE: wimlib
          WANT: ${{ inputs.platforms || 'all' }}
          IS_NEW: ${{ needs.resolve.outputs.is_new }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/select-platforms.py

  build:
    name: build (${{ matrix.name }})
    needs: [resolve, setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:nativestrict
      MSYSTEM: ${{ matrix.msystem || '' }}
      WIMLIB_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          symlinks: true
      - run: git config --global core.symlinks true
        if: runner.os == 'Windows'

      - name: Setup MSYS2 (${{ matrix.msystem }})
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true

      - name: Download wimlib tarball
        uses: actions/download-artifact@v4
        with:
          name: wimlib-tarball
          path: .

      - name: Install unpack tools (Linux container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends xz-utils tar gzip

      - name: Unpack sources
        run: tar -xzf wimlib-${{ needs.resolve.outputs.version }}.tar.gz

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache-wimlib
          key: ccache-wimlib-${{ matrix.name }}-${{ needs.resolve.outputs.version }}
          restore-keys: |
            ccache-wimlib-${{ matrix.name }}-
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache-wimlib

      - name: Build wimlib (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache-wimlib"
          bash scripts/build-wimlib.sh

      - name: Build wimlib (Unix)
        if: runner.os != 'Windows'
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache-wimlib"
          bash scripts/build-wimlib.sh

      - name: Package portable tree (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/package-wimlib.sh
        env:
          PORTABLE_DIR: ${{ github.workspace }}/wimlib-portable

      - name: Package portable tree (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/package-wimlib.sh
        env:
          PORTABLE_DIR: ${{ github.workspace }}/wimlib-portable

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/smoke-wimlib.sh
        env:
          PORTABLE_DIR: ${{ github.workspace }}/wimlib-portable

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/smoke-wimlib.sh
        env:
          PORTABLE_DIR: ${{ github.workspace }}/wimlib-portable

      - name: Write BUILD-INFO manifest
        run: |
          {
            echo "wimlib_version=${WIMLIB_VERSION}"
            echo "platform=${{ matrix.name }}"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "built_utc=$(date -u +%FT%TZ)"
            echo "runner_arch=$(uname -m)"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "container=${{ matrix.container || 'none' }}"
            command -v gcc >/dev/null 2>&1 && gcc --version | head -1 || true
            command -v clang >/dev/null 2>&1 && clang --version | head -1 | xargs || true
            command -v ccache >/dev/null 2>&1 && ccache --version | head -1 || true
          } > "dist/BUILD-INFO-wimlib-${{ matrix.name }}.txt"
          cat "dist/BUILD-INFO-wimlib-${{ matrix.name }}.txt"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wimlib-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release portable wimlib binaries
    needs: [resolve, setup, build]
    # Releases are never overwritten: a new upstream version takes
    # wimlib-vX.Y.Z, rebuilds take wimlib-vX.Y.Z-<run_number>.
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-wimlib-*
          merge-multiple: true
          path: dist
      - run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh
      - id: meta
        env:
          VER: ${{ needs.resolve.outputs.version }}
          IS_NEW: ${{ needs.resolve.outputs.is_new }}
          SQUASH_MSG: ${{ github.event.head_commit.message }}
        run: |
          base="wimlib-v${VER}"
          if [[ "$IS_NEW" == "true" ]]; then
            tag="$base"
            title="wimlib ${VER} portable"
          else
            tag="${base}-${GITHUB_RUN_NUMBER}"
            title="wimlib ${VER} portable rebuild ${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$title" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_BODY_EOF'
            if [[ -n "$SQUASH_MSG" ]]; then
              # Squash-merged PR title+body: what changed and why.
              echo "$SQUASH_MSG"
              echo
              echo "---"
            fi
            echo "Portable zero-install wimlib ${VER} (wimlib-imagex + bundled libs)."
            echo "Overlays onto qemu-portable: copy \`bin/wimlib-imagex\` (Linux/macOS) or \`wimlib-imagex.exe\` (Windows, extracted folder root with no \`bin/\`) next to the qemu binaries."
            echo "Built from pinned source (https://wimlib.net/downloads); no admin/install needed."
            echo "macOS adhoc-signed (\`xattr -cr\` may be needed after download)."
            echo "Each archive ships with a \`BUILD-INFO-wimlib-<platform>.txt\` provenance record."
            echo RELEASE_BODY_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          files: dist/*
