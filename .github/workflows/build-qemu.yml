name: build-qemu-portable

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-qemu.yml"
      - "scripts/*qemu*"
      - "scripts/select-platforms.py"
      - "config/qemu/**"
  pull_request:
    paths:
      - ".github/workflows/build-qemu.yml"
      - "scripts/*qemu*"
      - "scripts/select-platforms.py"
      - "config/qemu/**"
  workflow_dispatch:
    inputs:
      qemu_version:
        description: "QEMU version (e.g. X.Y.Z) or 'auto' for latest stable"
        required: false
        default: "auto"
        type: string
      targets:
        description: "What to build: 'native' (host-arch emulator only) | 'both' (x86_64 + aarch64 emulators everywhere) | 'all' (every guest arch QEMU supports)"
        required: false
        default: "native"
        type: choice
        options: [native, both, all]
      platforms:
        description: "'all' or comma-separated subset to build: win-x64,linux-x64,linux-arm64,macos-arm64 (e.g. 'macos-arm64' to iterate on one leg)"
        required: false
        default: "all"
        type: string
      force:
        description: "Publish a release even if this QEMU version already has one (e.g. rebuilt for a new toolchain/runner image)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * 1" # weekly Monday version check
  release:
    types: [published]

permissions:
  contents: write

# New pushes supersede in-progress runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGETS_MODE: ${{ inputs.targets || 'native' }}
  PREFIX: /qemu-portable

jobs:
  resolve:
    name: Resolve QEMU version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tarball: ${{ steps.v.outputs.tarball }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: bash scripts/resolve-qemu.sh "${{ inputs.qemu_version || 'auto' }}"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          QEMU_VERSION: ${{ steps.v.outputs.version }}
        # One release per upstream version: skip publishing if this version
        # already has a release (build still runs for validation/artifacts).
        run: |
          if gh release view "qemu-v${QEMU_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-tarball
          path: qemu-*.tar.xz*

  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    needs: [resolve]
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      publish: ${{ steps.m.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          PIPELINE: qemu
          WANT: ${{ inputs.platforms || 'all' }}
          IS_NEW: ${{ needs.resolve.outputs.is_new }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/select-platforms.py

  build:
    name: build (${{ matrix.name }})
    needs: [resolve, setup]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    # Lean QEMU build: ~15 min (Linux) to ~40 min (Intel macOS). Fail fast on
    # a real hang instead of burning the 6h default timeout.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:nativestrict
      MSYSTEM: ${{ matrix.msystem || '' }}
      QEMU_VERSION: ${{ needs.resolve.outputs.version }}
      TARGETS_MODE: ${{ inputs.targets || 'native' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # QEMU's meson/python build uses symlinks; keep them intact on Windows.
          symlinks: true
      - run: git config --global core.symlinks true
        if: runner.os == 'Windows'

      - name: Setup MSYS2 (${{ matrix.msystem }})
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true

      - name: Download QEMU tarball
        uses: actions/download-artifact@v4
        with:
          name: qemu-tarball
          path: .

      - name: Install unpack tools (Linux container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends xz-utils tar

      - name: Unpack sources
        run: tar -xf qemu-${{ needs.resolve.outputs.version }}.tar.xz

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ needs.resolve.outputs.version }}-${{ inputs.targets || 'native' }}
          restore-keys: |
            ccache-${{ matrix.name }}-
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      # NOTE: `shell:` accepts no expressions (no runner/matrix context), so
      # Windows (MSYS2) and Unix steps are duplicated with literal shells.
      - name: Build QEMU (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          bash "${{ matrix.build_script }}"

      - name: Build QEMU (Unix)
        if: runner.os != 'Windows'
        run: |
          export CCACHE_DIR="${{ github.workspace }}/.ccache"
          bash "${{ matrix.build_script }}"

      - name: Package portable tree (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash "${{ matrix.package_script }}"

      - name: Package portable tree (Unix)
        if: runner.os != 'Windows'
        run: bash "${{ matrix.package_script }}"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/smoke-qemu.sh
        env:
          PORTABLE_DIR: ${{ github.workspace }}/qemu-portable

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/smoke-qemu.sh
        env:
          PORTABLE_DIR: ${{ github.workspace }}/qemu-portable

      - name: Write BUILD-INFO manifest
        # Provenance record shipped inside artifacts and releases: answers
        # "which toolchain built this binary" for same-version rebuilds.
        run: |
          {
            echo "qemu_version=${QEMU_VERSION}"
            echo "targets_mode=${TARGETS_MODE}"
            echo "platform=${{ matrix.name }}"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "built_utc=$(date -u +%FT%TZ)"
            echo "runner_arch=$(uname -m)"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "container=${{ matrix.container || 'none' }}"
            command -v gcc >/dev/null 2>&1 && gcc --version | head -1 || true
            command -v clang >/dev/null 2>&1 && clang --version | head -1 | xargs || true
            command -v ccache >/dev/null 2>&1 && ccache --version | head -1 || true
          } > "dist/BUILD-INFO-${{ matrix.name }}.txt"
          cat "dist/BUILD-INFO-${{ matrix.name }}.txt"

      - name: Save build.ninja on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-ninja-${{ matrix.name }}
          path: build/build.ninja

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release portable binaries
    needs: [resolve, setup, build]
    # Publish only complete sets for new upstream versions — or any full-set
    # manual run with force=true (e.g. rebuilt for a new toolchain image).
    # Subset iteration runs stop at artifacts. Releases are never overwritten:
    # a new upstream version takes qemu-vX.Y.Z, rebuilds take
    # qemu-vX.Y.Z-<run_number>, so the proven release stays intact.
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh
      - id: meta
        env:
          VER: ${{ needs.resolve.outputs.version }}
          IS_NEW: ${{ needs.resolve.outputs.is_new }}
          TARGETS: ${{ inputs.targets || 'native' }}
          SQUASH_MSG: ${{ github.event.head_commit.message }}
        run: |
          base="qemu-v${VER}"
          if [[ "$IS_NEW" == "true" ]]; then
            tag="$base"
            title="QEMU ${VER} portable (${TARGETS})"
          else
            tag="${base}-${GITHUB_RUN_NUMBER}"
            title="QEMU ${VER} portable rebuild ${GITHUB_RUN_NUMBER} (${TARGETS})"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$title" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_BODY_EOF'
            if [[ -n "$SQUASH_MSG" ]]; then
              # Squash-merged PR title+body: what changed and why.
              echo "$SQUASH_MSG"
              echo
              echo "---"
            fi
            echo "Portable zero-install QEMU ${VER} (${TARGETS} targets)."
            echo
            echo "- Native: host-arch emulator only (x86_64 on Intel, aarch64 on ARM) + qemu-img + SeaBIOS/EDK2 firmware. No arch mixing."
            echo "- Both (\`targets=both\`): x86_64 + aarch64 emulators on every host (run foreign-arch guests via software emulation)."
            echo "- Full (\`targets=all\`): all softmmu emulators (FreeBSD/other arches)."
            echo "- Accel: KVM (Linux) / HVF (macOS) / WHPX (Windows) + TCG fallback. Headless via \`-display none -nographic\`."
            echo "- Layout: extract and run: Linux/macOS \`./qemu-portable/bin/qemu-system-x86_64 --version\`; Windows \`qemu-system-x86_64.exe --version\` from the extracted folder root (exes sit at the top level, no \`bin/\`). No installer/admin needed."
            echo "- Linux built on a digest-pinned Ubuntu 22.04 container (glibc 2.35 floor; see BUILD-INFO-*.txt for the exact toolchain); macOS adhoc-signed for local HVF (\`xattr -d com.apple.quarantine\` may be needed after download); Windows is SDL-only (no GTK assets), exes + DLLs at the zip root."
            echo "- Each archive is accompanied by a \`BUILD-INFO-<platform>.txt\` provenance record (commit, runner image, compiler, container digest)."
            echo RELEASE_BODY_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          files: dist/*
