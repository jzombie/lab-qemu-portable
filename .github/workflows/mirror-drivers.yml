name: mirror-virtio-drivers

# Verified mirror of the virtio-win driver ISO (redistributable Fedora
# binaries — unlike Windows ISOs, hosting a copy here is fine).
# Tags drivers-YYYYMMDD releases so headless installs don't depend on
# fedorapeople at boot time. Never triggers QEMU/wimlib builds and vice versa.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-drivers.yml"
      - "scripts/mirror-virtio.sh"
  pull_request:
    paths:
      - ".github/workflows/mirror-drivers.yml"
      - "scripts/mirror-virtio.sh"
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if today's drivers tag already exists"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 7 * * 1" # weekly Monday, after the QEMU/wimlib checks

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve drivers tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      is_new: ${{ steps.check.outputs.is_new }}
    steps:
      - id: t
        run: echo "tag=drivers-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        # One release per mirror date: skip publishing if the tag already has
        # a release (fetch still runs for validation/artifacts).
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  mirror:
    name: Fetch + verify driver ISO
    runs-on: ubuntu-latest
    needs: [resolve]
    outputs:
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/mirror-virtio.sh dist/drivers
      - id: p
        # PR runs validate only (fetch + magic + sha256); publishing happens
        # on main/schedule/dispatch for new dates, or when forced.
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" \
            && ("${{ needs.resolve.outputs.is_new }}" == "true" \
              || "${{ inputs.force }}" == "true") ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: drivers
          path: dist/drivers/*
          if-no-files-found: error

  release:
    name: Release driver pack
    needs: [resolve, mirror]
    # Releases are never overwritten: a new mirror date takes
    # drivers-YYYYMMDD, same-day rebuilds (force) take
    # drivers-YYYYMMDD-<run_number>.
    if: needs.mirror.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drivers
          path: dist
      - id: meta
        env:
          BASE_TAG: ${{ needs.resolve.outputs.tag }}
          IS_NEW: ${{ needs.resolve.outputs.is_new }}
          SQUASH_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$IS_NEW" == "true" ]]; then
            tag="$BASE_TAG"
          else
            tag="${BASE_TAG}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_BODY_EOF'
            if [[ -n "$SQUASH_MSG" ]]; then
              # Squash-merged PR title+body: what changed and why.
              echo "$SQUASH_MSG"
              echo
              echo "---"
            fi
            echo "Verified mirror of the virtio-win driver ISO (\`virtio-win.iso\` + \`virtio-win.iso.sha256\` + \`SOURCES.txt\`) rsynced from fedorapeople \`stable-virtio\`."
            echo "For headless Windows installs: attach as a second cdrom alongside the installer ISO and your \`Autounattend.xml\` drive."
            echo "Drop-in replacement for fetching from upstream at install time."
            echo RELEASE_BODY_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: virtio-win driver pack (${{ steps.meta.outputs.tag }})
          body: ${{ steps.meta.outputs.body }}
          files: dist/*
